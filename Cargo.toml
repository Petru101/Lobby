[package]
name = "lobby"
version = "0.1.7"
edition = "2021"
license = "GPL-3.0-or-later"
description = "One game library for Linux: Steam, Epic, GOG, itch.io, Lutris, Faugus, Heroic and games found on your drives"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
flate2 = "1"
libc = "0.2"
# Checks updates' signatures; no dependencies of its own.
minisign-verify = "0.3"
# Built in from github.com/Petru101/gamefix at this commit (run/pin-gamefix.sh moves it); a gamefix
# checkout beside this one (../gaming) is used instead when .cargo/config.toml patches it in
# (run/cargo.sh writes that).
gamefix = { git = "https://github.com/Petru101/gamefix", rev = "952cf2e5604ceb993d6b65fff6afcb0365edd43c" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
webkit6 = "0.6"
